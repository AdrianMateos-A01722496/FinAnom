<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FINANOM — Sistema de Auditoría</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --r:  #d64040;
      --rl: #fdf1f1;
      --rb: #f0c4c4;
      --dk: #1a1a1a;
      --md: #555555;
      --lt: #8c8c8c;
      --bg: #f2f1ef;
      --ca: #ffffff;
      --bo: #e2e0db;
      --bd: #cbc8c2;
    }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--dk); }
    .tab-active   { color: var(--r); border-bottom: 2px solid var(--r); font-weight: 700; }
    .tab-inactive { color: var(--md); border-bottom: 2px solid transparent; }
    .tab-inactive:hover { color: var(--dk); }
    #modal-overlay { display: none; }
    #modal-overlay.open { display: flex; }
    tr.clickable:hover td { background: #fdf6f6 !important; cursor: pointer; }
    .fade-in { animation: fadeIn 0.18s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .shap-fill { transition: width 0.45s ease; }
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 10px; font-weight: 700; padding: 2px 7px;
      border-radius: 2px; white-space: nowrap;
      letter-spacing: 0.06em; text-transform: uppercase;
    }
    .badge-alta        { background: #fdf1f1; color: #b92020; border: 1px solid #f0c4c4; }
    .badge-media       { background: #fdf9ec; color: #7a5200; border: 1px solid #e8d070; }
    .badge-informativa { background: #f0fdf4; color: #15692b; border: 1px solid #bbf7d0; }
    .badge-pendiente   { background: #f5f4f2; color: #3a3a3a; border: 1px solid #d8d5d0; }
    .badge-autorizado  { background: #f0fdf4; color: #15692b; border: 1px solid #bbf7d0; }
    .badge-desestimado { background: #f5f4f2; color: #666666; border: 1px solid #d8d5d0; }
    .badge-escalado    { background: #fff7ed; color: #c2410c; border: 1px solid #fed7aa; }
    .badge-anomalia    { background: #fdf1f1; color: #b92020; border: 1px solid #f0c4c4; }
    .badge-normal      { background: #eef7f1; color: #15692b; border: 1px solid #bbf7d0; }
    .badge-nueva       { background: #fff7ed; color: #c2410c; border: 1px solid #fed7aa; }
    .sev-dot-alta        { width: 6px; height: 6px; border-radius: 50%; background: #d64040; display: inline-block; flex-shrink: 0; }
    .sev-dot-media       { width: 6px; height: 6px; border-radius: 50%; background: #c8940a; display: inline-block; flex-shrink: 0; }
    .sev-dot-informativa { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; display: inline-block; flex-shrink: 0; }
    code { font-family: 'Menlo', 'Consolas', monospace; background: #eceae6; padding: 1px 5px; border-radius: 2px; font-size: 0.82em; color: var(--dk); }
    textarea:focus, input:focus, select:focus { outline: 2px solid var(--r); outline-offset: 1px; }
    .btn-p {
      background: var(--r); color: #fff; font-size: 12px; font-weight: 700;
      padding: 6px 14px; border-radius: 2px; letter-spacing: 0.04em;
      border: none; cursor: pointer; transition: opacity 0.15s;
    }
    .btn-p:hover { opacity: 0.86; }
    .btn-p:disabled { opacity: 0.45; cursor: wait; }
    .btn-s {
      background: transparent; color: var(--md); font-size: 12px; font-weight: 600;
      padding: 6px 14px; border-radius: 2px; border: 1px solid var(--bd);
      cursor: pointer; transition: background 0.12s;
    }
    .btn-s:hover { background: var(--bg); }
    .btn-s:disabled { opacity: 0.35; cursor: default; }
    .th { padding: 9px 16px; font-size: 10px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--lt); text-align: left; }
    .fpill { font-size: 11px; font-weight: 700; padding: 4px 12px; border-radius: 2px; cursor: pointer; letter-spacing: 0.04em; background: var(--bg); color: var(--md); border: 1px solid var(--bo); transition: all 0.12s; white-space: nowrap; }
    .fpill:hover { background: var(--bd); color: var(--dk); border-color: var(--bd); }
    .flatpickr-calendar { border: 1px solid var(--bo) !important; box-shadow: 0 8px 32px rgba(0,0,0,0.12) !important; border-radius: 3px !important; font-family: inherit !important; }
    .flatpickr-months, .flatpickr-month, .flatpickr-weekdays, .flatpickr-weekday { background: var(--dk) !important; color: #fff !important; fill: #fff !important; }
    .flatpickr-weekday { color: rgba(255,255,255,0.5) !important; }
    .flatpickr-current-month .flatpickr-monthDropdown-months { background: var(--dk) !important; }
    .flatpickr-current-month input.cur-year { color: #fff !important; }
    .flatpickr-prev-month svg, .flatpickr-next-month svg { fill: #fff !important; }
    .flatpickr-day.selected, .flatpickr-day.startRange, .flatpickr-day.endRange,
    .flatpickr-day.selected:hover, .flatpickr-day.startRange:hover, .flatpickr-day.endRange:hover { background: var(--r) !important; border-color: var(--r) !important; color: #fff !important; }
    .flatpickr-day.inRange { background: var(--rl) !important; border-color: var(--rl) !important; box-shadow: -5px 0 0 var(--rl), 5px 0 0 var(--rl) !important; color: var(--dk) !important; }
    .flatpickr-day:hover:not(.selected):not(.startRange):not(.endRange):not(.inRange) { background: var(--bg) !important; }
    .flatpickr-day.today:not(.selected) { border-color: var(--r) !important; }
  </style>
</head>
<body>

<!-- HEADER -->
<header style="background:var(--ca);border-bottom:1px solid var(--bo);" class="sticky top-0 z-30">
  <div class="max-w-7xl mx-auto px-5 flex items-center justify-between h-14">
    <div class="flex items-center gap-2">
      <span style="color:var(--r);font-size:15px;font-weight:900;letter-spacing:0.04em;text-transform:uppercase;">TCA</span>
      <span style="color:var(--md);font-size:14px;font-weight:600;">Hotel Demo</span>
    </div>
    <nav class="flex gap-1" style="margin-left:6px;">
      <button id="tab-dashboard" onclick="setView('dashboard')" class="tab-active px-4 py-4 text-sm transition-colors">Dashboard</button>
      <button id="tab-lista" onclick="setView('lista')" class="tab-inactive px-4 py-4 text-sm transition-colors">
        Transacciones Históricas <span id="badge-total" style="background:var(--bg);color:var(--lt);font-size:10px;font-weight:600;padding:1px 7px;border-radius:10px;margin-left:3px;">–</span>
      </button>
      <button id="tab-stats" onclick="setView('stats')" class="tab-inactive px-4 py-4 text-sm transition-colors">Estadísticas</button>
    </nav>
    <div class="flex items-center gap-2">
      <button id="btn-apply-corrections" onclick="aplicarCorrecciones()" class="btn-p">Aplicar correcciones</button>
      <button onclick="exportarRevisiones()" class="btn-s">Exportar CSV</button>
      <span id="apply-status" style="font-size:11px;color:var(--lt);" class="hidden md:inline"></span>
      <div id="date-display" style="font-size:11px;color:var(--lt);" class="hidden md:block"></div>
    </div>
  </div>
</header>

<!-- MAIN -->
<main class="max-w-7xl mx-auto px-5 py-6">
  <div id="view-dashboard"></div>
  <div id="view-lista" class="hidden"></div>
  <div id="view-stats" class="hidden"></div>
</main>

<!-- MODAL -->
<div id="modal-overlay"
     class="fixed inset-0 z-50 items-start justify-center p-4 pt-10 overflow-y-auto"
     style="background:rgba(0,0,0,0.42);"
     onclick="if(event.target===this)closeModal()">
  <div id="modal-box" style="background:var(--ca);border-radius:3px;box-shadow:0 24px 64px rgba(0,0,0,0.16);overflow:hidden;" class="w-full max-w-2xl mb-10 fade-in">
    <div id="modal-content"></div>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════════════════════════════
let DATA       = [];
let LIST_RECORDS = [];
let TX_META    = { total: 0, page: 1, page_size: 25, total_pages: 1, summary: {} };
let TX_API_AVAILABLE = null;
let FALLBACK_DATA = null;
let TX_STATUS = '';
let STATES     = JSON.parse(localStorage.getItem('finanom_states_v2') || '{}');
function saveStates() { localStorage.setItem('finanom_states_v2', JSON.stringify(STATES)); }
let currentView = 'dashboard';
let selectedTx  = null;
const DEFAULT_FILTERS = {
  folio: '',
  cuarto: '',
  concepto: '',
  q: '',
  fechaPreset: '',
  fechaDesde: '',
  fechaHasta: '',
  categoria: '',
  severity: '',
  estado: '',
  montoMin: '',
  montoMax: '',
  sortBy: 'priority',
  sortDir: 'asc',
  txMode: 'todas',
};
let filters     = { ...DEFAULT_FILTERS };
let dashboardDate = '';
let dashboardPageSize = localStorage.getItem('finanom_dashboard_page_size') || 'all';
let dashboardCache = new Map();
let listPage    = 1;
const PAGE_SIZE = 25;
const DASHBOARD_ALL_PAGE_SIZE = 10000;
let simulatingScenario = null;
const MESES     = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
let chartSev = null, chartCat = null, chartHr = null;

// ════════════════════════════════════════════════════════════════════════════
// SVG ICONS
// ════════════════════════════════════════════════════════════════════════════
const IC = {
  chart:   `<svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" viewBox="0 0 24 24"><rect x="3" y="12" width="4" height="9" rx="0.5"/><rect x="10" y="7" width="4" height="14" rx="0.5"/><rect x="17" y="3" width="4" height="18" rx="0.5"/></svg>`,
  clock:   `<svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polyline points="12,6 12,12 16,14"/></svg>`,
  check:   `<svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" viewBox="0 0 24 24"><polyline points="20,6 9,17 4,12"/></svg>`,
  up:      `<svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5,12 12,5 19,12"/></svg>`,
  warn:    `<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,
  search:  `<svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>`,
  list:    `<svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24"><line x1="9" y1="6" x2="21" y2="6"/><line x1="9" y1="12" x2="21" y2="12"/><line x1="9" y1="18" x2="21" y2="18"/><circle cx="4" cy="6" r="1" fill="currentColor" stroke="none"/><circle cx="4" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="4" cy="18" r="1" fill="currentColor" stroke="none"/></svg>`,
  close:   `<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`,
  finance: `<svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>`,
  time:    `<svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12,6 12,12 16,14"/></svg>`,
  copy:    `<svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="1"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>`,
  user:    `<svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
  doc:     `<svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14,2 14,8 20,8"/></svg>`,
  info:    `<svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,
};

// ════════════════════════════════════════════════════════════════════════════
// CATEGORY → ICON TYPE
// ════════════════════════════════════════════════════════════════════════════
const CAT_TYPE = {
  'Posible duplicado':             'copy',
  'Monto atipico':                 'finance',
  'Cargo vs tarifa':               'finance',
  'Fuera de estancia':             'time',
  'Horario inusual':               'time',
  'Proporcion fiscal atipica':     'finance',
  'Inconsistencia de signo':       'finance',
  'Metodo de pago':                'finance',
  'Egreso sospechoso':             'finance',
  'Patron atipico (modelo)':       'copy',
  'Modificacion sospechosa':       'user',
  'Alta densidad de cargos':       'copy',
  'Cancelacion irregular':         'doc',
  'Inconsistencia de reservacion': 'doc',
  'Sin reservacion enlazada':      'doc',
  'Codigo infrecuente':            'info',
  'Usuario con baja actividad':    'user',
  'Division de cuenta':            'finance',
  'Observacion relevante':         'info',
};

const catIcon = c => {
  const t = CAT_TYPE[c] ?? 'info';
  return `<span style="color:var(--lt);display:inline-flex;align-items:center;vertical-align:middle;">${IC[t]}</span>`;
};

// ════════════════════════════════════════════════════════════════════════════
// HELPERS
// ════════════════════════════════════════════════════════════════════════════
function getFiltered() {
  return DATA.filter(d => {
    if (filters.txMode === 'anomalias' && !isTxAnomaly(d)) return false;
    if (filters.q && !matchesQuery(d, filters.q)) return false;
    if (filters.folio    && !String(d.trace_t_folio).toLowerCase().includes(filters.folio.toLowerCase())) return false;
    if (filters.cuarto   && !String(d.trace_t_cuarto??'').toLowerCase().includes(filters.cuarto.toLowerCase())) return false;
    if (filters.concepto && !String(d.trace_t_codigo).toLowerCase().includes(filters.concepto.toLowerCase())) return false;
    if (filters.categoria && !splitCats(d).includes(filters.categoria)) return false;
    if (filters.severity && d.severity !== filters.severity) return false;
    if (filters.estado   && getState(d) !== filters.estado)  return false;
    const txDate = new Date(String(d.trace_t_timestamp).replace(' ', 'T'));
    if (filters.fechaDesde && (isNaN(txDate) || txDate < parseFechaFiltro(filters.fechaDesde))) return false;
    if (filters.fechaHasta && (isNaN(txDate) || txDate > parseFechaFiltro(filters.fechaHasta, true))) return false;
    return true;
  });
}
function getState(tx) { return STATES[tx.trace_row_id]?.estado ?? tx.estado ?? 'Pendiente'; }
function getNota(tx)  { return STATES[tx.trace_row_id]?.nota  ?? ''; }
function resetFilters() { filters = { ...DEFAULT_FILTERS }; }
function effectiveDashboardDate() {
  return dashboardDate || TX_META.summary?.selected_day || TX_META.summary?.latest_day || '';
}
function shiftISODate(iso, deltaDays) {
  const [y, m, d] = String(iso || '').split('-').map(Number);
  if (!y || !m || !d) return '';
  const dt = new Date(Date.UTC(y, m - 1, d));
  dt.setUTCDate(dt.getUTCDate() + deltaDays);
  return dt.toISOString().slice(0, 10);
}
function displayDashboardDate() {
  const iso = effectiveDashboardDate();
  if (!iso) return 'Día más reciente';
  const [y, m, d] = iso.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d));
  return dt.toLocaleDateString('es-MX', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric', timeZone: 'UTC' });
}
function dashboardPageSizeValue() {
  return dashboardPageSize === 'all' ? DASHBOARD_ALL_PAGE_SIZE : Number(dashboardPageSize || 50);
}
function dashboardCacheKey() {
  return JSON.stringify({
    day: effectiveDashboardDate(),
    page: listPage,
    pageSize: dashboardPageSizeValue(),
    txMode: filters.txMode,
    q: filters.q,
    folio: filters.folio,
    cuarto: filters.cuarto,
    concepto: filters.concepto,
    categoria: filters.categoria,
    montoMin: filters.montoMin,
    montoMax: filters.montoMax,
    severity: filters.severity,
    sortBy: filters.sortBy,
    sortDir: filters.sortDir,
  });
}
function updateHeaderCount() {
  const n = TX_API_AVAILABLE
    ? Number(TX_META.summary?.total_global ?? TX_META.total ?? 0)
    : DATA.length;
  document.getElementById('badge-total').textContent = n.toLocaleString('es-MX');
}
function truthy(v) { return v === true || v === 1 || String(v).toLowerCase() === 'true'; }
function isTxAnomaly(tx) {
  if (tx && Object.prototype.hasOwnProperty.call(tx, 'is_anomaly')) return truthy(tx.is_anomaly);
  return true;
}
function splitCats(tx) {
  return String(tx?.categories || '').split(' | ').map(c => c.trim()).filter(Boolean);
}
function matchesQuery(tx, query) {
  const q = String(query || '').trim().toLowerCase();
  if (!q) return true;
  return [
    tx.trace_row_id, tx.trace_t_folio, tx.trace_t_folio_ext, tx.trace_t_transaccion,
    tx.trace_t_cuarto, tx.trace_t_codigo, tx.trace_t_cve_res, tx.categories, tx.explanation,
  ].some(v => String(v ?? '').toLowerCase().includes(q));
}
function escAttr(v) { return String(v ?? '').replace(/"/g, '&quot;'); }
function normalizeSeverity(v, isAnomaly) {
  const raw = String(v || '').trim();
  const map = { ALTO:'Alta', CRITICO:'Alta', CRITICO_ALTO:'Alta', MEDIO:'Media', BAJO:'Informativa' };
  if (['Alta','Media','Informativa'].includes(raw)) return raw;
  if (map[raw.toUpperCase()]) return map[raw.toUpperCase()];
  return isAnomaly ? 'Informativa' : 'Informativa';
}
function normalizeCategories(tx, isAnomaly) {
  if (tx.categories) return String(tx.categories);
  if (tx.tipo_inconsistencia) {
    return String(tx.tipo_inconsistencia)
      .split(' | ')
      .map(c => c.replaceAll('_', ' ').toLowerCase().replace(/\b\w/g, ch => ch.toUpperCase()))
      .join(' | ');
  }
  return isAnomaly ? 'Patron atipico (modelo)' : 'Transaccion normal';
}
function normalizeReasons(tx, categories, isAnomaly) {
  if (tx.reasons_json) return String(tx.reasons_json);
  const cats = categories.split(' | ').filter(Boolean);
  return JSON.stringify(cats.map((categoria, i) => ({
    categoria,
    texto: isAnomaly ? 'El sistema encontro una senal relevante en esta transaccion' : 'Transaccion sin senales de anomalia',
    peso_shap: Math.max(0.35, 1 - i * 0.15),
  })));
}
function normalizeRecord(tx, index = 0, forceNew = false) {
  const isAnomaly = Object.prototype.hasOwnProperty.call(tx, 'is_anomaly') ? truthy(tx.is_anomaly) : true;
  const categories = normalizeCategories(tx, isAnomaly);
  const severity = normalizeSeverity(tx.severity ?? tx.severidad, isAnomaly);
  const monto = tx.monto ?? tx.trace_t_importe ?? tx.importe ?? tx.amount ?? 0;
  return {
    ...tx,
    trace_row_id: tx.trace_row_id ?? tx.id ?? `tx-${Date.now()}-${index}`,
    trace_t_folio: tx.trace_t_folio ?? tx.folio ?? '–',
    trace_t_folio_ext: tx.trace_t_folio_ext ?? '0',
    trace_t_transaccion: tx.trace_t_transaccion ?? tx.transaccion ?? tx.trace_row_id ?? '–',
    trace_t_cuarto: tx.trace_t_cuarto ?? tx.cuarto ?? '–',
    trace_t_codigo: tx.trace_t_codigo ?? tx.codigo ?? '–',
    trace_t_timestamp: tx.trace_t_timestamp ?? tx.timestamp ?? tx.fecha ?? '',
    trace_t_cve_res: tx.trace_t_cve_res ?? tx.cve_res ?? '',
    anomaly_rank: tx.anomaly_rank ?? tx.rank ?? index + 1,
    display_rank: tx.display_rank ?? tx.daily_rank ?? tx.anomaly_rank ?? tx.rank ?? index + 1,
    severity,
    categories,
    explanation: tx.explanation ?? tx.motivos ?? (isAnomaly ? 'Transaccion marcada para revision.' : 'Transaccion normal sin senales de anomalia.'),
    reasons_json: normalizeReasons(tx, categories, isAnomaly),
    monto,
    es_abono: tx.es_abono ?? (Number(monto) >= 0 ? 1 : 0),
    estado: tx.estado ?? 'Pendiente',
    is_anomaly: isAnomaly,
    es_nueva: forceNew || truthy(tx.es_nueva),
  };
}
function mergeRecords(base, incoming) {
  const byId = new Map(base.map(tx => [String(tx.trace_row_id), tx]));
  incoming.forEach(tx => byId.set(String(tx.trace_row_id), { ...(byId.get(String(tx.trace_row_id)) || {}), ...tx }));
  return [...byId.values()];
}
function anomalyLabel(tx) {
  const label = isTxAnomaly(tx) ? 'Anomalia' : 'Normal';
  const cls = isTxAnomaly(tx) ? 'badge-anomalia' : 'badge-normal';
  return `<span class="badge ${cls}">${label}</span>${tx.es_nueva ? ' <span class="badge badge-nueva">Nueva</span>' : ''}`;
}
function fmt(n) {
  const v = Number(n);
  return '$' + (isNaN(v) ? '–' : v.toLocaleString('es-MX', { maximumFractionDigits: 0 }));
}
function fmtDate(s) {
  if (!s || s === 'None') return '–';
  try {
    const d = new Date(String(s).replace(' ', 'T'));
    return d.toLocaleString('es-MX', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
  } catch { return String(s); }
}
function sevBadge(sev) {
  const cls = { Alta:'badge-alta', Media:'badge-media', Informativa:'badge-informativa' };
  const dot = { Alta:'sev-dot-alta', Media:'sev-dot-media', Informativa:'sev-dot-informativa' };
  return `<span class="badge ${cls[sev]??'badge-desestimado'}"><span class="${dot[sev]??''}"></span>${sev}</span>`;
}
function estadoBadge(e) {
  const cls = { Pendiente:'badge-pendiente', Autorizado:'badge-autorizado', Desestimado:'badge-desestimado', Escalado:'badge-escalado' };
  return `<span class="badge ${cls[e]??'badge-desestimado'}">${e}</span>`;
}
function getTx(id) { return LIST_RECORDS.find(d => String(d.trace_row_id) === String(id)) || DATA.find(d => String(d.trace_row_id) === String(id)); }
function collectReviewedRows() {
  const rows = [];
  DATA.forEach(tx => {
    const st = STATES[tx.trace_row_id];
    if (st && st.estado && st.estado !== 'Pendiente')
      rows.push({ trace_row_id: tx.trace_row_id, trace_t_transaccion: tx.trace_t_transaccion, estado: st.estado, nota: st.nota || '' });
  });
  return rows;
}
async function loadAnomalies() {
  try {
    const res = await fetch('/api/anomalies');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const rows = await res.json();
    return rows.map((tx, i) => normalizeRecord({ ...tx, is_anomaly: true }, i));
  } catch {
    const res = await fetch('data/anomalies.json');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const rows = await res.json();
    return rows.map((tx, i) => normalizeRecord({ ...tx, is_anomaly: true }, i));
  }
}

async function fetchTransactionsPage({ page = 1, pageSize = PAGE_SIZE, scope = 'all' } = {}) {
  const dashboardDay = scope === 'today' ? effectiveDashboardDate() : '';
  const params = new URLSearchParams({
    filter: filters.txMode === 'anomalias' ? 'anomalias' : 'todas',
    scope,
    severidad: filters.severity || '',
    q: filters.q || '',
    folio: filters.folio || '',
    cuarto: filters.cuarto || '',
    concepto: filters.concepto || '',
    categoria: filters.categoria || '',
    date_from: scope === 'today' ? dashboardDay : (filters.fechaDesde || ''),
    date_to: scope === 'today' ? dashboardDay : (filters.fechaHasta || ''),
    monto_min: filters.montoMin || '',
    monto_max: filters.montoMax || '',
    sort_by: filters.sortBy || 'priority',
    sort_dir: filters.sortDir || 'asc',
    page: String(page),
    page_size: String(pageSize),
  });
  const res = await fetch(`/api/transactions?${params.toString()}`);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const payload = await res.json();
  const records = (payload.records || []).map((tx, i) => normalizeRecord(tx, (page - 1) * pageSize + i));
  return {
    records,
    total: Number(payload.total ?? records.length),
    page: Number(payload.page ?? page),
    page_size: Number(payload.page_size ?? pageSize),
    total_pages: Math.max(1, Number(payload.total_pages ?? Math.ceil((payload.total ?? records.length) / pageSize))),
    summary: payload.summary || {},
  };
}

function filterFallbackRows(rows) {
  return rows.filter(tx => {
    if (filters.txMode === 'anomalias' && !isTxAnomaly(tx)) return false;
    if (filters.q && !matchesQuery(tx, filters.q)) return false;
    if (filters.severity && tx.severity !== filters.severity) return false;
    return true;
  });
}

async function loadTransactionsForList({ showSpinner = false, scope = 'all' } = {}) {
  if (showSpinner) document.getElementById('view-lista').innerHTML = loadingMarkup('Cargando transacciones...');

  if (TX_API_AVAILABLE !== false) {
    try {
      const page = await fetchTransactionsPage({ page: listPage, pageSize: PAGE_SIZE, scope });
      TX_API_AVAILABLE = true;
      TX_META = page;
      LIST_RECORDS = page.records;
      DATA = mergeRecords(DATA, page.records);
      TX_STATUS = 'Backend /api/transactions';
      return;
    } catch (e) {
      TX_API_AVAILABLE = false;
      TX_STATUS = 'Fallback local anomalies.json';
    }
  }

  if (!FALLBACK_DATA) FALLBACK_DATA = await loadAnomalies();
  const filtered = filterFallbackRows(FALLBACK_DATA);
  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  if (listPage > totalPages) listPage = totalPages;
  LIST_RECORDS = filtered.slice((listPage - 1) * PAGE_SIZE, listPage * PAGE_SIZE);
  TX_META = { total: filtered.length, page: listPage, page_size: PAGE_SIZE, total_pages: totalPages, summary: { total_anomalias: filtered.length } };
  DATA = FALLBACK_DATA;
}

async function loadDashboardData({ force = false } = {}) {
  const requestKey = dashboardCacheKey();
  if (!force && dashboardCache.has(requestKey)) {
    const cached = dashboardCache.get(requestKey);
    LIST_RECORDS = cached.records;
    TX_META = cached.meta;
    DATA = mergeRecords(DATA, cached.records);
    dashboardDate = cached.meta.summary?.selected_day || dashboardDate || cached.meta.summary?.latest_day || '';
    TX_STATUS = 'Backend /api/transactions';
    return;
  }

  if (TX_API_AVAILABLE !== false) {
    try {
      const page = await fetchTransactionsPage({ page: listPage, pageSize: dashboardPageSizeValue(), scope: 'today' });
      TX_API_AVAILABLE = true;
      LIST_RECORDS = page.records;
      DATA = mergeRecords(DATA, page.records);
      TX_META = page;
      dashboardDate = page.summary?.selected_day || dashboardDate || page.summary?.latest_day || '';
      dashboardCache.set(requestKey, { records: page.records, meta: page });
      dashboardCache.set(dashboardCacheKey(), { records: page.records, meta: page });
      TX_STATUS = 'Backend /api/transactions';
      return;
    } catch (e) {
      TX_API_AVAILABLE = false;
      TX_STATUS = 'Fallback local anomalies.json';
    }
  }

  if (!FALLBACK_DATA) FALLBACK_DATA = await loadAnomalies();
  DATA = FALLBACK_DATA;
  TX_META = { total: DATA.length, page: 1, page_size: PAGE_SIZE, total_pages: Math.max(1, Math.ceil(DATA.length / PAGE_SIZE)), summary: { total_anomalias: DATA.length } };
}

function loadingMarkup(label) {

async function setView(v) {

  ['dashboard','lista','stats'].forEach(name => {
    document.getElementById(`view-${name}`).classList.toggle('hidden', name !== v);
    const tab = document.getElementById(`tab-${name}`);
    if (tab) tab.className = (name===v?'tab-active':'tab-inactive') + ' px-4 py-4 text-sm transition-colors';

  if (v === 'lista')     { listPage = 1; await renderLista({ showSpinner: true }); }
  if (v === 'stats')     renderStats();

  dashboardDate = next;

  await loadDashboardData();
  renderDashboard();
  updateHeaderCount();
}

// FECHA PRESET
// ════════════════════════════════════════════════════════════════════════════
function setFechaPreset(preset) {
  filters.fechaPreset = preset;
  const now   = new Date();
  const toISO = localISO;
  const today = toISO(now);
  if (preset === '') {
    filters.fechaDesde = ''; filters.fechaHasta = '';
  } else if (preset === 'hoy') {
    filters.fechaDesde = today; filters.fechaHasta = today;
  } else if (preset === 'semana') {
    const d = new Date(now); const day = d.getDay() || 7;
    d.setDate(d.getDate() - day + 1);
    filters.fechaDesde = toISO(d); filters.fechaHasta = today;
  } else if (preset === 'mes') {
    filters.fechaDesde = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-01`;
    filters.fechaHasta = today;
  } else if (preset === 'mes_ant') {
    const last  = new Date(now.getFullYear(), now.getMonth(), 0);
    const first = new Date(now.getFullYear(), now.getMonth() - 1, 1);
    filters.fechaDesde = toISO(first); filters.fechaHasta = toISO(last);
  } else if (preset === 'personalizado') {
    filters.fechaDesde = ''; filters.fechaHasta = '';
  }
  listPage = 1;
  if (currentView === 'stats') renderStats(); else renderLista();
}
function localISO(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function parseFechaFiltro(dateStr, finDelDia = false) {
  const [y, m, d] = dateStr.split('-').map(Number);
  return new Date(y, m - 1, d, finDelDia ? 23 : 0, finDelDia ? 59 : 0, finDelDia ? 59 : 0);
}

function isoToDisplay(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  if (!y || !m || !d) return '';
  return `${d}/${m}/${y}`;
}

function parseFechaManual(value) {
  const raw = String(value || '').trim();
  if (!raw) return '';

  // Acepta formato YYYY-MM-DD
  let m = raw.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (m) {
    const y = Number(m[1]);
    const mo = Number(m[2]);
    const d = Number(m[3]);
    const dt = new Date(y, mo - 1, d);
    if (dt.getFullYear() === y && dt.getMonth() === mo - 1 && dt.getDate() === d) {
      return `${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    }
  }

  // Acepta formato DD/MM/YYYY o DD-MM-YYYY
  m = raw.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);
  if (m) {
    const d = Number(m[1]);
    const mo = Number(m[2]);
    const y = Number(m[3]);
    const dt = new Date(y, mo - 1, d);
    if (dt.getFullYear() === y && dt.getMonth() === mo - 1 && dt.getDate() === d) {
      return `${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    }
  }

  alert('Formato de fecha inválido. Usa DD/MM/AAAA. Ejemplo: 12/03/2021');
  return null;
}

function aplicarFechaManual() {
  const desdeInput = document.getElementById('fecha-desde-manual');
  const hastaInput = document.getElementById('fecha-hasta-manual');
  if (!desdeInput || !hastaInput) return;

  const desde = parseFechaManual(desdeInput.value);
  const hasta = parseFechaManual(hastaInput.value);

  if (desde === null || hasta === null) return;

  filters.fechaDesde = desde;
  filters.fechaHasta = hasta;

  if (filters.fechaDesde && filters.fechaHasta && parseFechaFiltro(filters.fechaDesde) > parseFechaFiltro(filters.fechaHasta, true)) {
    alert('La fecha inicial no puede ser mayor que la fecha final.');
    return;
  }

  listPage = 1;
  if (currentView === 'stats') renderStats(); else renderLista();
}

function limpiarFechaManual() {
  filters.fechaDesde = '';
  filters.fechaHasta = '';
  listPage = 1;
  if (currentView === 'stats') renderStats(); else renderLista();
}

async function applyListFilter() {
  listPage = 1;
  await applyFiltersFromPanel(currentView === 'dashboard' ? 'today' : 'all');
}

function readFiltersFromPanel(scope) {
  const rootId = scope === 'today' ? 'view-dashboard' : 'view-lista';
  const root = document.getElementById(rootId) || document;
  const val = id => root.querySelector(`#${id}`)?.value?.trim() || '';
  return {
    fechaDesde: val('f-fecha-desde'),
    fechaHasta: val('f-fecha-hasta'),
    folio: val('f-folio'),
    cuarto: val('f-cuarto'),
    concepto: val('f-concepto'),
    categoria: val('f-categoria'),
    montoMin: val('f-monto-min'),
    montoMax: val('f-monto-max'),
    severity: val('f-severity'),
    sortBy: val('f-sort-by') || 'priority',
    sortDir: val('f-sort-dir') || 'asc',
  };
}

async function applyFiltersFromPanel(scope) {
  const next = readFiltersFromPanel(scope);
  if (scope === 'today') {
    next.fechaDesde = '';
    next.fechaHasta = '';
  }
  if (next.fechaDesde && next.fechaHasta && next.fechaDesde > next.fechaHasta) {
    alert('La fecha inicial no puede ser mayor que la fecha final.');
    return;
  }
  filters = { ...filters, ...next };
  listPage = 1;
  if (scope === 'today') {
    await loadDashboardData();
    renderDashboard();
  } else {
    await renderLista({ showSpinner: true });
  }
  updateHeaderCount();
}

async function clearFilters(scope) {
  resetFilters();
  listPage = 1;
  if (scope === 'today') {
    await loadDashboardData();
    renderDashboard();
  } else {
    await renderLista({ showSpinner: true });
  }
  updateHeaderCount();
}

async function refreshCurrentData(force = false) {
  if (currentView === 'lista') {
    await renderLista({ showSpinner: true });
  } else if (currentView === 'dashboard') {
    if (force) dashboardCache.clear();
    await loadDashboardData({ force });
    renderDashboard();
  } else {
    renderStats();
  }
  updateHeaderCount();
}

async function simularTransaccion(scenario) {
  simulatingScenario = scenario;
  if (currentView === 'lista') renderLista(); else setView(currentView);
  try {
    const res = await fetch('/api/transactions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ scenario }),
    });
    const payload = await res.json();
    if (!res.ok || !payload.transaction) throw new Error(payload.message || `HTTP ${res.status}`);
    const tx = normalizeRecord(payload.transaction, 0, true);
    dashboardCache.clear();
    DATA = mergeRecords(DATA, [tx]);
    LIST_RECORDS = mergeRecords([tx], LIST_RECORDS);
    filters.txMode = 'todas';
    listPage = 1;
    await renderLista({ showSpinner: true });
    openModal(tx.trace_row_id);
  } catch (e) {
    alert(`No se pudo simular la transaccion.\n\n${e.message}`);
  } finally {
    simulatingScenario = null;
    if (currentView === 'lista') renderLista(); else setView(currentView);
  }
}

function listaRow(tx) {

  const visibleRank = tx.display_rank ?? tx.anomaly_rank;
  return `
  <tr class="clickable" style="border-bottom:1px solid var(--bg);${tx.es_nueva?'background:#fff7ed;box-shadow:inset 3px 0 0 #ea580c;':''}" onclick="openModal('${tx.trace_row_id}')">

    <td style="padding:10px 16px;font-size:11px;font-family:monospace;color:var(--lt);">${isTxAnomaly(tx) ? '#'+visibleRank : '–'}</td>
    <td style="padding:10px 16px;font-weight:700;color:var(--dk);font-size:13px;">${tx.trace_t_folio}</td>
    <td style="padding:10px 16px;color:var(--md);font-size:12px;">${tx.trace_t_cuarto??'–'}</td>

      <div style="display:flex;flex-wrap:wrap;gap:4px;">
        ${shown.map(c=>`
          <span style="display:inline-flex;align-items:center;gap:3px;font-size:11px;background:var(--bg);border:1px solid var(--bo);padding:2px 7px;border-radius:2px;color:var(--md);white-space:nowrap;">

// MODAL
// ════════════════════════════════════════════════════════════════════════════
function openModal(id) {
  selectedTx = String(id);
  renderModal();
  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
  selectedTx = null;
}

function renderModal() {
  if (!selectedTx) return;
  const tx = getTx(selectedTx);
  if (!tx) return;

  const isAnomaly = isTxAnomaly(tx);
  const estado = getState(tx);
  const nota   = getNota(tx);
  let reasons  = [];
  if (isAnomaly) {
    try { reasons = JSON.parse(tx.reasons_json); } catch {}
  }
  const maxShap = reasons.length > 0 ? Math.max(...reasons.map(r => r.peso_shap)) : 1;
  const rankLabel = tx.display_rank && tx.display_rank !== tx.anomaly_rank
    ? `Rango del día #${tx.display_rank} · global #${tx.anomaly_rank}`
    : `Rango global #${tx.anomaly_rank}`;

  const actionCfg = [
    { key:'Autorizado',  icon:'✓', bg:'#16a34a' },
    { key:'Desestimado', icon:'✗', bg:'#525252' },
    { key:'Escalado',    icon:'↑', bg:'#ea580c' },
  ];
  const actionBtns = actionCfg.map(({key,icon,bg}) => {
    const isActive = estado === key;
    return `<button onclick="takeAction('${tx.trace_row_id}','${key}')"
      style="background:${bg};color:#fff;font-size:13px;font-weight:700;padding:8px 18px;border-radius:2px;cursor:pointer;letter-spacing:0.03em;transition:opacity 0.15s;${isActive?'outline:2px solid '+bg+';outline-offset:2px;':'opacity:0.72;'}"
      onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='${isActive?'1':'0.72'}'">
      ${icon} ${key}
    </button>`;
  }).join('');

  const resRef = tx.trace_t_cve_res && tx.trace_t_cve_res !== 'None' && String(tx.trace_t_cve_res).trim();

  document.getElementById('modal-content').innerHTML = `
  <div style="background:var(--ca);border-bottom:1px solid var(--bo);padding:18px 24px;" class="sticky top-0 z-10">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px;">
      <div style="flex:1;">
        <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:6px;">
          ${sevBadge(tx.severity)}
          ${isAnomaly ? `<span style="font-size:11px;font-family:monospace;color:var(--lt);">${rankLabel}</span>` : '<span style="font-size:11px;font-family:monospace;color:var(--lt);">Sin alerta</span>'}
          ${anomalyLabel(tx)}
          ${estadoBadge(estado)}
        </div>
        <h2 style="font-weight:800;color:var(--dk);font-size:15px;line-height:1.3;letter-spacing:-0.01em;">
          Folio&nbsp;${tx.trace_t_folio}${tx.trace_t_folio_ext&&tx.trace_t_folio_ext!=='0'?'-'+tx.trace_t_folio_ext:''}
          &nbsp;·&nbsp;Cuarto&nbsp;${tx.trace_t_cuarto??'–'}
          &nbsp;·&nbsp;<code>${tx.trace_t_codigo}</code>
        </h2>
        <p style="font-size:11px;color:var(--lt);margin-top:4px;">${fmtDate(tx.trace_t_timestamp)}</p>
      </div>
      <button onclick="closeModal()" style="color:var(--lt);display:flex;flex-shrink:0;margin-top:2px;cursor:pointer;transition:color 0.12s;"
        onmouseover="this.style.color='var(--dk)'" onmouseout="this.style.color='var(--lt)'">${IC.close}</button>
    </div>
  </div>

  <div style="padding:16px 24px;background:var(--bg);border-bottom:1px solid var(--bo);">
    <div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;">
      <span style="font-size:32px;font-weight:900;color:var(--dk);letter-spacing:-0.02em;line-height:1;">${fmt(tx.monto)}</span>
      <span style="font-size:11px;font-weight:700;color:var(--md);letter-spacing:0.06em;text-transform:uppercase;">
        ${tx.es_abono?'↓ Abono / Crédito':'↑ Cargo'}
      </span>
      ${resRef?`<span style="font-size:11px;color:var(--lt);border:1px solid var(--bo);padding:2px 8px;border-radius:2px;">Res. ${resRef}</span>`:''}
    </div>
  </div>

  <div style="padding:20px 24px;">
    <p style="font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--lt);margin-bottom:16px;">

    </p>
    <div style="display:flex;flex-direction:column;gap:16px;">
      ${reasons.length===0

          return `
          <div style="display:flex;gap:12px;">
            <span style="color:var(--lt);display:flex;flex-shrink:0;margin-top:2px;">${IC[CAT_TYPE[r.categoria]??'info']}</span>
            <div style="flex:1;">
              <div style="display:flex;align-items:center;gap:8px;margin-bottom:5px;">
                <span style="font-size:13px;font-weight:700;color:var(--dk);">${r.categoria}</span>
                <span style="font-size:11px;color:var(--lt);font-family:monospace;">${r.peso_shap.toFixed(3)}</span>

                <div class="shap-fill" style="height:3px;border-radius:1px;width:${barW}%;background:${barColors[i]??'#8b5cf6'};"></div>

  ${isAnomaly ? `
  <div style="padding:16px 24px;border-top:1px solid var(--bo);">
    <p style="font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--lt);margin-bottom:12px;">Tomar acción</p>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:${estado!=='Pendiente'?'8':'14'}px;">${actionBtns}</div>
    ${estado !== 'Pendiente' ? `
    <div style="margin-bottom:14px;">
      <button onclick="takeAction('${tx.trace_row_id}','Pendiente')"
        style="font-size:11px;font-weight:700;color:var(--lt);cursor:pointer;background:transparent;border:1px solid var(--bo);padding:5px 12px;border-radius:2px;letter-spacing:0.03em;transition:all 0.12s;"
        onmouseover="this.style.color='var(--dk)';this.style.borderColor='var(--bd)'"
        onmouseout="this.style.color='var(--lt)';this.style.borderColor='var(--bo)'">

      </button>

      placeholder="Agregar nota (queda registrada junto a la decisión)..."

    <button id="btn-nota-${tx.trace_row_id}" onclick="saveNota('${tx.trace_row_id}')"

      Guardar nota
    </button>
  </div>` : `
  <div style="padding:16px 24px;border-top:1px solid var(--bo);">
    <p style="font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--lt);margin-bottom:12px;">Detalle operativo</p>

      <div><strong style="color:var(--dk);">Referencia:</strong> ${tx.trace_t_referencia ?? tx.trace_t_cve_res ?? '–'}</div>
      <div><strong style="color:var(--dk);">Tipo:</strong> ${tx.es_abono?'Abono / Crédito':'Cargo'}</div>
      <div><strong style="color:var(--dk);">Categoría:</strong> ${splitCats(tx).join(' · ') || 'Transaccion normal'}</div>
    </div>
  </div>`}

  <div style="padding:16px 24px;border-top:1px solid var(--bo);background:#fffafa;">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;">
      <div>
        <p style="font-size:10px;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;color:var(--r);margin-bottom:4px;">Eliminar de SQL</p>
        <p style="font-size:12px;color:var(--md);line-height:1.4;">Borra esta transacción de la tabla <code>transacciones</code>. Esta acción no se puede deshacer.</p>
      </div>
      <button onclick="deleteTransaction('${tx.trace_row_id}')"
        style="background:var(--r);color:#fff;font-size:12px;font-weight:800;padding:8px 16px;border-radius:2px;cursor:pointer;letter-spacing:0.03em;">
        Eliminar transacción
      </button>
    </div>
  </div>`;
}

function takeAction(rowId, action) {
  const id = String(rowId);
  if (action === 'Pendiente') {
    if (STATES[id]) { delete STATES[id].estado; if (!STATES[id].nota) delete STATES[id]; }
  } else {
    if (!STATES[id]) STATES[id] = {};
    STATES[id].estado = action;
  }
  saveStates();
  renderModal();
  if (currentView === 'dashboard') renderDashboard();
  if (currentView === 'lista')     renderLista();
}

function saveNota(id) {
  const input = document.getElementById(`nota-input-${id}`);
  if (!input) return;
  if (!STATES[id]) STATES[id] = {};
  STATES[id].nota = input.value;
  saveStates();
  const btn = document.getElementById(`btn-nota-${id}`);
  if (btn) {
    const orig = btn.textContent;
    btn.textContent = '✓ Guardada';
    setTimeout(() => { if (btn) btn.textContent = orig; }, 1800);
  }
}

async function deleteTransaction(rowId) {
  const id = String(rowId);
  const tx = getTx(id);
  const folio = tx?.trace_t_folio ?? id;
  const ok = confirm(`¿Seguro que quieres eliminar para siempre la transacción folio ${folio}?\n\nSe borrará de SQL y desaparecerá del dashboard.`);
  if (!ok) return;

  try {
    const res = await fetch(`/api/transactions/${encodeURIComponent(id)}`, { method: 'DELETE' });
    const payload = await res.json().catch(() => ({}));
    if (!res.ok || payload.ok === false) throw new Error(payload.message || `HTTP ${res.status}`);

    DATA = DATA.filter(d => String(d.trace_row_id) !== id);
    LIST_RECORDS = LIST_RECORDS.filter(d => String(d.trace_row_id) !== id);
    if (STATES[id]) {
      delete STATES[id];
      saveStates();
    }
    dashboardCache.clear();
    closeModal();
    await refreshCurrentData(true);
  } catch (e) {
    alert(`No se pudo eliminar la transacción.\n\n${e.message}`);
  }
}

function renderStats() {

  const hasFilters = filters.fechaPreset || filters.categoria || filters.severity || filters.estado;

  const catCounts = {};
  filtered.forEach(d => { splitCats(d).forEach(c => { catCounts[c] = (catCounts[c]||0)+1; }); });
  const topCats = Object.entries(catCounts).sort((a,b)=>b[1]-a[1]).slice(0,10);

  const sevCounts = { Alta:0, Media:0, Informativa:0 };
  filtered.forEach(d => { if (sevCounts[d.severity]!==undefined) sevCounts[d.severity]++; });

        <span style="font-size:9px;font-weight:700;letter-spacing:0.09em;text-transform:uppercase;color:var(--lt);">Severidad</span>
        <select onchange="filters.severity=this.value;renderStats()"
          style="padding:5px 10px;font-size:12px;border:1px solid ${filters.severity?'var(--r)':'var(--bo)'};border-radius:2px;background:var(--ca);color:var(--dk);cursor:pointer;">
          <option value="">Todas</option>
          <option value="Alta"        ${filters.severity==='Alta'       ?'selected':''}>Alta</option>
          <option value="Media"       ${filters.severity==='Media'      ?'selected':''}>Media</option>
          <option value="Informativa" ${filters.severity==='Informativa'?'selected':''}>Informativa</option>
        </select>
      </div>

      <div style="display:flex;flex-direction:column;gap:3px;">
        <span style="font-size:9px;font-weight:700;letter-spacing:0.09em;text-transform:uppercase;color:var(--lt);">Estado</span>
        <select onchange="filters.estado=this.value;renderStats()"
          style="padding:5px 10px;font-size:12px;border:1px solid ${filters.estado?'var(--r)':'var(--bo)'};border-radius:2px;background:var(--ca);color:var(--dk);cursor:pointer;">
          <option value="">Todos</option>
          <option value="Pendiente"   ${filters.estado==='Pendiente'   ?'selected':''}>Pendiente</option>
          <option value="Autorizado"  ${filters.estado==='Autorizado'  ?'selected':''}>Autorizado</option>
          <option value="Desestimado" ${filters.estado==='Desestimado' ?'selected':''}>Desestimado</option>
          <option value="Escalado"    ${filters.estado==='Escalado'    ?'selected':''}>Escalado</option>
        </select>
      </div>

      <div style="margin-left:auto;display:flex;align-items:flex-end;gap:12px;padding-bottom:1px;">
        <span style="font-size:11px;font-weight:600;color:var(--lt);">${filtered.length.toLocaleString('es-MX')} anomalía${filtered.length!==1?'s':''}</span>
        ${hasFilters?`<button onclick="filters.fechaPreset='';filters.fechaDesde='';filters.fechaHasta='';filters.categoria='';filters.severity='';filters.estado='';renderStats()" style="font-size:11px;font-weight:700;color:var(--r);cursor:pointer;letter-spacing:0.04em;">Limpiar todo</button>`:''}
      </div>

      ${filters.fechaPreset === 'personalizado' ? `
      <div style="display:flex;flex-direction:column;gap:3px;">
        <span style="font-size:9px;font-weight:700;letter-spacing:0.09em;text-transform:uppercase;color:var(--lt);">Desde</span>
        <input id="fecha-desde-manual" type="text" value="${isoToDisplay(filters.fechaDesde)}" placeholder="dd/mm/aaaa"
          onkeydown="if(event.key==='Enter')aplicarFechaManual()"
          style="padding:5px 10px;font-size:12px;border:1px solid ${filters.fechaDesde?'var(--r)':'var(--bo)'};border-radius:2px;background:var(--ca);width:128px;">
      </div>
      <div style="display:flex;flex-direction:column;gap:3px;">
        <span style="font-size:9px;font-weight:700;letter-spacing:0.09em;text-transform:uppercase;color:var(--lt);">Hasta</span>
        <input id="fecha-hasta-manual" type="text" value="${isoToDisplay(filters.fechaHasta)}" placeholder="dd/mm/aaaa"
          onkeydown="if(event.key==='Enter')aplicarFechaManual()"
          style="padding:5px 10px;font-size:12px;border:1px solid ${filters.fechaHasta?'var(--r)':'var(--bo)'};border-radius:2px;background:var(--ca);width:128px;">
      </div>
      <div style="display:flex;flex-direction:column;gap:3px;">
        <span style="font-size:9px;color:transparent;">·</span>
        <button onclick="aplicarFechaManual()" class="btn-p" style="font-size:12px;padding:5px 14px;">Aplicar</button>
      </div>` : ''}

    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

    <div style="background:var(--ca);border:1px solid var(--bo);padding:20px;">
      <p style="font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--lt);margin-bottom:16px;">Distribución por severidad</p>
      <div style="display:flex;align-items:center;gap:32px;">
        <div style="position:relative;width:140px;height:140px;flex-shrink:0;"><canvas id="chart-sev"></canvas></div>
        <div style="display:flex;flex-direction:column;gap:12px;">
          ${[['Alta','#d64040'],['Media','#c8940a'],['Informativa','#22c55e']].map(([s,c])=>`
          <div style="display:flex;align-items:center;gap:10px;">
            <span style="width:8px;height:8px;border-radius:50%;background:${c};flex-shrink:0;"></span>
            <span style="font-size:13px;color:var(--md);width:76px;">${s}</span>
            <span style="font-size:18px;font-weight:800;color:var(--dk);">${sevCounts[s]}</span>
            <span style="font-size:11px;color:var(--lt);">${filtered.length>0?(sevCounts[s]/filtered.length*100).toFixed(0):0}%</span>
          </div>`).join('')}
          <div style="padding-top:8px;border-top:1px solid var(--bo);">
            <p style="font-size:11px;color:var(--lt);">Total: <strong style="color:var(--md);">${filtered.length}</strong> anomalías</p>
          </div>
        </div>
      </div>
    </div>

    <div style="background:var(--ca);border:1px solid var(--bo);padding:20px;">
      <p style="font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--lt);margin-bottom:16px;">Estado de revisión</p>
      <div style="display:flex;flex-direction:column;gap:14px;">
        ${[['Pendiente','#3b3b3b',estadoCounts.Pendiente],['Autorizado','#22c55e',estadoCounts.Autorizado],['Desestimado','#a0a0a0',estadoCounts.Desestimado],['Escalado','#ea580c',estadoCounts.Escalado]]
          .map(([label,color,cnt])=>{
            const pct = filtered.length>0?cnt/filtered.length*100:0;
            return `<div>
              <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;">
                <span style="color:var(--md);">${label}</span>
                <span style="font-weight:700;color:var(--dk);">${cnt} <span style="font-size:11px;font-weight:400;color:var(--lt);">(${pct.toFixed(0)}%)</span></span>
              </div>
              <div style="height:3px;background:var(--bo);border-radius:1px;">
                <div style="height:3px;border-radius:1px;width:${pct.toFixed(1)}%;background:${color};transition:width 0.4s;"></div>
              </div>
            </div>`;
          }).join('')}
      </div>
    </div>
  </div>

  <div style="background:var(--ca);border:1px solid var(--bo);padding:20px;">
    <p style="font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--lt);margin-bottom:16px;">Top 10 categorías detectadas</p>
    <canvas id="chart-cat" height="240"></canvas>
  </div>

  <div style="background:var(--ca);border:1px solid var(--bo);padding:20px;">
    <p style="font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--lt);margin-bottom:4px;">Distribución horaria de anomalías</p>
    <p style="font-size:11px;color:var(--lt);margin-bottom:16px;">Barras rojas = horas con mayor concentración de anomalías</p>
    <canvas id="chart-hr" height="110"></canvas>
  </div>

  <div style="background:var(--ca);border:1px solid var(--bo);overflow:hidden;">
    <div style="padding:12px 20px;border-bottom:1px solid var(--bo);">
      <p style="font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--lt);">Detalle de categorías</p>
    </div>
    <table class="w-full text-sm">
      <thead>
        <tr style="background:var(--bg);border-bottom:1px solid var(--bo);">
          <th class="th">Categoría</th>
          <th class="th" style="text-align:right;">Anomalías</th>
          <th class="th" style="text-align:right;">% del total</th>
          <th class="th" style="width:160px;">Peso relativo</th>
        </tr>
      </thead>
      <tbody>
        ${topCats.map(([cat,cnt])=>`
        <tr style="border-bottom:1px solid var(--bg);"
            onmouseover="this.style.background='var(--bg)'" onmouseout="this.style.background=''">
          <td style="padding:9px 20px;color:var(--md);">
            <span style="display:inline-flex;align-items:center;gap:6px;">${catIcon(cat)}<span>${cat}</span></span>
          </td>
          <td style="padding:9px 20px;text-align:right;font-weight:700;color:var(--dk);">${cnt}</td>
          <td style="padding:9px 20px;text-align:right;color:var(--md);">${filtered.length>0?(cnt/filtered.length*100).toFixed(0):0}%</td>
          <td style="padding:9px 20px;">
            <div style="height:3px;background:var(--bo);border-radius:1px;">
              <div style="height:3px;background:var(--r);border-radius:1px;width:${(cnt/topCats[0][1]*100).toFixed(1)}%;"></div>
            </div>
          </td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>

</div>`;

  if (chartSev) { chartSev.destroy(); chartSev = null; }
  if (chartCat) { chartCat.destroy(); chartCat = null; }
  if (chartHr)  { chartHr.destroy();  chartHr  = null; }

  chartSev = new Chart(document.getElementById('chart-sev'), {
    type: 'doughnut',
    data: {
      labels: ['Alta','Media','Informativa'],
      datasets: [{ data:[sevCounts.Alta,sevCounts.Media,sevCounts.Informativa], backgroundColor:['#d64040','#c8940a','#22c55e'], borderWidth:0, hoverOffset:4 }],
    },
    options: {
      cutout: '65%',
      plugins: { legend:{display:false}, tooltip:{callbacks:{label:ctx=>` ${ctx.label}: ${ctx.parsed} (${filtered.length>0?(ctx.parsed/filtered.length*100).toFixed(0):0}%)`}} },
    },
  });

  chartCat = new Chart(document.getElementById('chart-cat'), {
    type: 'bar',
    data: {
      labels: topCats.map(([c])=>c.length>28?c.slice(0,28)+'…':c),
      datasets: [{ data:topCats.map(([,v])=>v), backgroundColor:'#d64040', borderRadius:2, borderSkipped:false }],
    },
    options: {
      indexAxis: 'y',
      plugins: { legend:{display:false} },
      scales: {
        x: { grid:{color:'#eeece8'}, ticks:{color:'#8c8c8c'} },
        y: { grid:{display:false}, ticks:{color:'#555555',font:{size:11}} },
      },
    },
  });

  const maxHour = Math.max(...hourCounts);
  chartHr = new Chart(document.getElementById('chart-hr'), {
    type: 'bar',
    data: {
      labels: Array.from({length:24},(_,i)=>`${i}h`),
      datasets: [{ data:hourCounts, backgroundColor:hourCounts.map(v=>v>maxHour*0.6?'#d64040':v>maxHour*0.35?'#c8940a':'#c8c5bf'), borderRadius:2, borderSkipped:false }],
    },
    options: {
      plugins: { legend:{display:false}, tooltip:{callbacks:{title:([i])=>`${i.label} h`,label:ctx=>` ${ctx.parsed.y} anomalías`}} },
      scales: {
        x: { grid:{display:false}, ticks:{color:'#8c8c8c',font:{size:11}} },
        y: { grid:{color:'#eeece8'}, ticks:{color:'#8c8c8c',stepSize:5} },
      },
    },
  });
}

// ════════════════════════════════════════════════════════════════════════════
// EXPORTAR / APLICAR
// ════════════════════════════════════════════════════════════════════════════
function exportarRevisiones() {
  const reviewed = collectReviewedRows();
  if (reviewed.length === 0) {
    alert('No hay revisiones para exportar.\nMarca alertas como Autorizado / Desestimado / Escalado primero.');
    return;
  }
  const rows = [['trace_row_id','trace_t_transaccion','estado','nota']];
  reviewed.forEach(r => {
    const nota = (r.nota||'').replace(/[\r\n,]/g,' ');
    rows.push([r.trace_row_id,r.trace_t_transaccion,r.estado,nota]);
  });
  const csv  = rows.map(r=>r.join(',')).join('\n');
  const blob = new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a    = document.createElement('a');
  a.href     = URL.createObjectURL(blob);
  a.download = 'revisiones.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

async function aplicarCorrecciones() {
  const reviewed = collectReviewedRows();
  if (reviewed.length === 0) {
    alert('No hay correcciones para aplicar.\nMarca alertas como Autorizado / Desestimado / Escalado primero.');
    return;
  }

  const btn    = document.getElementById('btn-apply-corrections');
  const status = document.getElementById('apply-status');
  const orig   = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Aplicando...';
  status.textContent = `${reviewed.length} revisión(es)`;
  status.classList.remove('hidden');

  try {
    const res    = await fetch('/api/apply-corrections',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reviews:reviewed})});
    const result = await res.json();
    if (!res.ok||!result.applied) throw new Error(result.message||`HTTP ${res.status}`);

    reviewed.forEach(r=>{delete STATES[r.trace_row_id];});
    saveStates();
    dashboardCache.clear();
    await refreshCurrentData(true);
    updateHeaderCount();
    status.textContent = `Cola ${result.queue_before.toLocaleString('es-MX')} → ${result.queue_after.toLocaleString('es-MX')}`;
    alert(`Correcciones aplicadas.\nRevisiones usadas: ${result.labels_used}\nCola: ${result.queue_before.toLocaleString('es-MX')} → ${result.queue_after.toLocaleString('es-MX')}\nMotivo: ${result.threshold_reason}`);
  } catch(e) {
    alert(`No se pudieron aplicar automaticamente.\n\n${e.message}\n\nAsegurate de abrir el dashboard con:\nuv run python model_final/app.py`);
  } finally {
    btn.disabled    = false;
    btn.textContent = orig;
  }
}

// ════════════════════════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════════════════════════
async function init() {
  document.getElementById('date-display').textContent =
    new Date().toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

  document.getElementById('view-dashboard').innerHTML = `
    <div style="display:flex;align-items:center;justify-content:center;padding:80px 20px;color:var(--lt);">
      <svg class="animate-spin" style="width:18px;height:18px;margin-right:10px;color:var(--r);" fill="none" viewBox="0 0 24 24">
        <circle style="opacity:0.25;" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path style="opacity:0.75;" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
      </svg>
      <span style="font-size:13px;">Cargando datos...</span>
    </div>`;

  try {
    await loadDashboardData();
  } catch(e) {
    document.getElementById('view-dashboard').innerHTML = `
      <div style="background:var(--rl);border:1px solid var(--rb);border-left:3px solid var(--r);padding:32px;text-align:center;" class="fade-in">
        <p style="font-size:15px;font-weight:800;color:#b92020;margin-bottom:8px;letter-spacing:-0.01em;">No se pudieron cargar los datos</p>
        <p style="font-size:13px;color:#b92020;margin-bottom:16px;">El dashboard requiere el servidor Flask local.</p>
        <div style="background:var(--ca);border:1px solid var(--rb);padding:12px 20px;display:inline-block;text-align:left;border-radius:2px;">
          <p style="font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--lt);margin-bottom:6px;">Ejecuta esto en la terminal:</p>
          <code style="font-size:13px;color:var(--dk);">uv run python model_final/app.py</code>
        </div>
        <p style="font-size:11px;color:#b92020;margin-top:12px;">Luego abre: <strong>http://127.0.0.1:5000</strong></p>
      </div>`;
    return;
  }

  updateHeaderCount();
  setView('dashboard');
}

init();
</script>
